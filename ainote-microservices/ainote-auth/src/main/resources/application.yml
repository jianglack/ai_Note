server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/ainote_auth
    username: ${DB_USER:ainote}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

app:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-must-be-at-least-32-characters-long}
    expiration-ms: 86400000
  internal:
    token: ${INTERNAL_TOKEN:dev-internal-token}
