server:
  port: 8084

spring:
  application:
    name: ai-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/ainote_ai
    username: ${DB_USER:ainote}
    password: ${DB_PASSWORD:ainote}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

app:
  internal:
    token: ${INTERNAL_TOKEN:default-internal-token}
  # DeepSeek 配置（对话 + Agent 统一使用）
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
    embedding-model: ${DEEPSEEK_EMBEDDING_MODEL:${DEEPSEEK_MODEL:deepseek-chat}}
    embedding-base-url: ${DEEPSEEK_EMBEDDING_BASE_URL:${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}}
    temperature: 0.2
    max-tokens: 4000
  embedding:
    dimension: 1024
  chat:
    max-memory-tokens: 8000
  agent:
    max-tool-invocations: 30
    timeout-seconds: 300
    tool-loop-max-repeated: 5
    max-tokens-per-request: 50000
    warn-tokens-threshold: 40000
  context:
    intent:
      llm-fallback: true
    note-max-chars: 800
    total-budget-tokens: 4000
    rag-min-score: 0.7
    budget:
      user-overview: 300
      selected-notes: 1500
      rag-context: 800
  neo4j:
    uri: bolt://${NEO4J_HOST:localhost}:7687
    user: neo4j
    password: ${NEO4J_PASSWORD:neo4j}
