version: "3.8"
services:
  postgres:
    image: postgres:15-alpine
    container_name: ainote-postgres
    environment:
      POSTGRES_USER: ainote
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ainote_auth
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    ports: ["5432:5432"]
    networks: [ainote-net]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ainote"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ainote-redis
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru
    ports: ["6379:6379"]
    networks: [ainote-net]
    mem_limit: 256m

  neo4j:
    image: neo4j:5-community
    container_name: ainote-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j123}
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4j-data:/data]
    networks: [ainote-net]
    mem_limit: 1g

  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: ainote-nacos
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 256m
    ports: ["8848:8848", "9848:9848"]
    networks: [ainote-net]
    mem_limit: 512m

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ainote-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: "ainote-kafka-cluster-001"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    ports: ["9092:9092"]
    networks: [ainote-net]
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  debezium:
    image: debezium/connect:2.5
    container_name: ainote-debezium
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: ainote-debezium
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      HEAP_OPTS: "-Xmx512m"
    ports: ["8083:8083"]
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }
    networks: [ainote-net]
    mem_limit: 512m

  elasticsearch:
    build: ./elasticsearch
    container_name: ainote-es
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx1g"
    ports: ["9200:9200"]
    volumes: [es-data:/usr/share/elasticsearch/data]
    networks: [ainote-net]
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  milvus:
    image: milvusdb/milvus:v2.3.7
    container_name: ainote-milvus
    command: milvus run standalone
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      COMMON_STORAGETYPE: local
    ports: ["19530:19530"]
    volumes: [milvus-data:/var/lib/milvus]
    networks: [ainote-net]
    mem_limit: 2g
    profiles: [milvus]

  # =================== Application Services ===================

  gateway:
    build: ../ainote-gateway
    container_name: ainote-gateway
    environment:
      NACOS_ADDR: nacos:8848
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      - nacos
      - redis
    networks:
      - ainote-net
    mem_limit: 512m

  auth:
    build: ../ainote-auth
    container_name: ainote-auth
    environment:
      NACOS_ADDR: nacos:8848
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      nacos:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - ainote-net
    mem_limit: 512m

  note:
    build: ../ainote-note
    container_name: ainote-note
    environment:
      NACOS_ADDR: nacos:8848
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      nacos:
        condition: service_started
    networks:
      - ainote-net
    mem_limit: 512m

  schedule:
    build: ../ainote-schedule
    container_name: ainote-schedule
    environment:
      NACOS_ADDR: nacos:8848
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      nacos:
        condition: service_started
    networks:
      - ainote-net
    mem_limit: 512m

  ai:
    build: ../ainote-ai
    container_name: ainote-ai
    environment:
      NACOS_ADDR: nacos:8848
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      REDIS_HOST: redis
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_EMBEDDING_MODEL: ${DEEPSEEK_EMBEDDING_MODEL:-deepseek-chat}
      DEEPSEEK_EMBEDDING_BASE_URL: ${DEEPSEEK_EMBEDDING_BASE_URL:-https://api.deepseek.com/v1}
      NEO4J_HOST: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      nacos:
        condition: service_started
      redis:
        condition: service_started
      neo4j:
        condition: service_started
    networks:
      - ainote-net
    mem_limit: 1g

  search:
    build: ../ainote-search
    container_name: ainote-search
    environment:
      NACOS_ADDR: nacos:8848
      KAFKA_SERVERS: kafka:9092
      ES_HOST: elasticsearch
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      MILVUS_ENABLED: ${MILVUS_ENABLED:-false}
      MILVUS_HOST: milvus
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      nacos:
        condition: service_started
    networks:
      - ainote-net
    mem_limit: 512m

volumes:
  postgres-data:
  neo4j-data:
  es-data:
  milvus-data:

networks:
  ainote-net:
    driver: bridge
