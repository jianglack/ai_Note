server:
  port: 8080

spring:
  application:
    name: ainote-gateway
  cloud:
    gateway:
      routes:
        - id: auth
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: notes
          uri: lb://note-service
          predicates:
            - Path=/api/notes/**,/api/folders/**,/api/tags/**,/api/annotations/**
        - id: ai-stream
          uri: lb://ai-service
          predicates:
            - Path=/api/ai/chat/stream
          metadata:
            response-timeout: 180000
            connect-timeout: 5000
        - id: ai
          uri: lb://ai-service
          predicates:
            - Path=/api/ai/**,/api/graph/**
        - id: schedules
          uri: lb://schedule-service
          predicates:
            - Path=/api/schedules/**
        - id: search
          uri: lb://search-service
          predicates:
            - Path=/api/search/**
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin

app:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-must-be-at-least-32-characters-long}
  internal:
    token: ${INTERNAL_TOKEN:dev-internal-token}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
