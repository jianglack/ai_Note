global:
  resolve_timeout: 1m

route:
  receiver: warning-webhook
  group_by:
    - service
    - alertname
    - severity
  group_wait: 1s
  group_interval: 5s
  repeat_interval: 4h
  routes:
    - receiver: critical-webhook
      matchers:
        - severity="critical"
      group_wait: 1s
      repeat_interval: 30m
    - receiver: warning-webhook
      matchers:
        - severity="warning"
      group_wait: 30s
      repeat_interval: 4h

receivers:
  - name: critical-webhook
    webhook_configs:
      - url: http://host.docker.internal:19099/alerts
        send_resolved: true
        max_alerts: 20

  - name: warning-webhook
    webhook_configs:
      - url: http://host.docker.internal:19099/alerts
        send_resolved: true
        max_alerts: 20

inhibit_rules:
  - source_matchers:
      - alertname="AiNoteBackendDown"
      - severity="critical"
    target_matchers:
      - service="ainote-backend"
      - alertname!="AiNoteBackendDown"
    equal:
      - service
