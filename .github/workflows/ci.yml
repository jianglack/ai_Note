name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify
        working-directory: backend
        run: mvn -B verify

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Production dependency vulnerability gate
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - name: Typecheck
        working-directory: frontend
        run: npx tsc -b
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Vitest coverage gate
        working-directory: frontend
        run: npm run test:coverage

  dependency-security:
    name: dependency security and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate backend CycloneDX SBOM
        working-directory: backend
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.2:makeAggregateBom -DskipTests
      - name: Generate frontend CycloneDX SBOM
        working-directory: frontend
        run: |
          npm ci
          mkdir -p target
          npm sbom --sbom-format cyclonedx > target/bom.json
      - name: Frontend npm audit gate
        working-directory: frontend
        run: >-
          npm audit --omit=dev --audit-level=high
          --registry=https://registry.npmjs.org --json > target/npm-audit.json
      - name: Install checksum-verified OSV Scanner
        env:
          OSV_SCANNER_VERSION: "2.4.0"
        run: |
          set -euo pipefail
          tool_dir="backend/target/security-tools/osv-scanner-v${OSV_SCANNER_VERSION}"
          mkdir -p "$tool_dir"
          base_url="https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}"
          curl --fail --silent --show-error --location \
            "$base_url/osv-scanner_linux_amd64" \
            --output "$tool_dir/osv-scanner_linux_amd64"
          curl --fail --silent --show-error --location \
            "$base_url/osv-scanner_SHA256SUMS" \
            --output "$tool_dir/SHA256SUMS"
          cd "$tool_dir"
          grep 'osv-scanner_linux_amd64$' SHA256SUMS | sha256sum --check --strict
          chmod +x osv-scanner_linux_amd64
          ./osv-scanner_linux_amd64 --version | grep "${OSV_SCANNER_VERSION}"
      - name: OSV vulnerability gate
        run: |
          set -euo pipefail
          scanner="backend/target/security-tools/osv-scanner-v2.4.0/osv-scanner_linux_amd64"
          report_dir="backend/target/security-compliance"
          mkdir -p "$report_dir"
          set +e
          "$scanner" scan source \
            -L backend/target/bom.json \
            -L frontend/target/bom.json \
            --format json \
            --output-file "$report_dir/osv-sbom-report-raw.json"
          raw_status=$?
          set -e
          if [ "$raw_status" -gt 1 ]; then
            echo "OSV raw scan was unavailable (exit $raw_status)" >&2
            exit "$raw_status"
          fi
          "$scanner" scan source \
            -L backend/target/bom.json \
            -L frontend/target/bom.json \
            --config security/osv-scanner.toml \
            --format json \
            --output-file "$report_dir/osv-sbom-report-gated.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: security-reports-and-sboms
          if-no-files-found: error
          retention-days: 14
          path: |
            backend/target/bom.*
            backend/target/security-compliance/osv-sbom-report-*.json
            frontend/target/bom.json
            frontend/target/npm-audit.json

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
