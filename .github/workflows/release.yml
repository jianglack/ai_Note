name: Release Artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-artifact:
    name: backend artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify and package backend
        working-directory: backend
        run: mvn -B verify
      - name: Upload backend jar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ainote-backend-${{ github.run_number }}
          path: backend/target/*.jar
          if-no-files-found: error
          retention-days: 30

  frontend-artifact:
    name: frontend artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc -b
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Coverage gate
        working-directory: frontend
        run: npm run test:coverage
      - name: Upload frontend dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ainote-frontend-${{ github.run_number }}
          path: frontend/dist/**
          if-no-files-found: error
          retention-days: 30

  release-manifest:
    name: release manifest
    runs-on: ubuntu-latest
    needs:
      - backend-artifact
      - frontend-artifact
    steps:
      - name: Write release manifest
        shell: bash
        run: |
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "ref=${GITHUB_REF}"
            echo "sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_number=${GITHUB_RUN_NUMBER}"
            echo "backend_artifact=ainote-backend-${GITHUB_RUN_NUMBER}"
            echo "frontend_artifact=ainote-frontend-${GITHUB_RUN_NUMBER}"
          } > release-manifest.txt
      - name: Upload release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ainote-release-manifest-${{ github.run_number }}
          path: release-manifest.txt
          if-no-files-found: error
          retention-days: 30
